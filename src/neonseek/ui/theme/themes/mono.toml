# black, white and grays only. states differ by icon and text alone
name = "Mono"
glow = false
dark = true
border = "#6E6E6E"

[bg]
base = "#000000"
surface = "#0E0E0E"
elevated = "#1F1F1F"

[text]
primary = "#FFFFFF"
muted = "#A6A6A6"
on_accent = "#000000"

[accent]
primary = "#FFFFFF"
secondary = "#BDBDBD"

[chip]
bg = "#1F1F1F"

[state]
success = "#FFFFFF"
queued = "#A6A6A6"
warning = "#FFFFFF"
error = "#FFFFFF"
