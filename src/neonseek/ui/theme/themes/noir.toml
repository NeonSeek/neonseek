# black like mono, with colored accents, state chips and headings like the other themes
name = "Noir"
glow = true
dark = true
border = "#3A3A3A"

[bg]
base = "#000000"
surface = "#0E0E0E"
elevated = "#1F1F1F"

[text]
primary = "#FFFFFF"
muted = "#A29BFE"
on_accent = "#000000"

[accent]
primary = "#FF3D8B"
secondary = "#2DE2E6"

[chip]
bg = "#2E0E20"

[state]
success = "#3DDC84"
queued = "#6EA8FF"
warning = "#FFC24B"
error = "#FF5C5C"
